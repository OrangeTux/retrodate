[package]
name = "retrodate"
version = "0.2.2"
edition = "2024"
repository = "https://github.com/OrangeTux/retrodate"

[dependencies]
argh = { version = "0.1.19", default-features = false, features = ["help"] }
color-eyre = { version = "0.6.5", default-features = false }
jiff = { version = "0.2.23", default-features = false, features = ["std"] }
regex = { version = "1.12.3", default-features = false, features = ["unicode-perl"] }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
ureq = { version = "3.3.0", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
tiny_http = { version = "0.12.0", default-features = false }
serde_json = { version = "1.0.149", default-features = false }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
