name: Release retrodate

on:
  push:


jobs:
  # Build binaries for several platforms.
  # The artifacts this build produces are used by other jobs.
  build-release:
    name: '${{ matrix.job.target }} (${{ matrix.job.os }})'
    runs-on: ${{ matrix.job.os }}
    strategy:
      matrix:
        job:
          # - { target: aarch64-unknown-linux-gnu   , os: ubuntu-24.04, use-cross: true }
          - { target: aarch64-unknown-linux-musl  , os: ubuntu-24.04, use-cross: true }
          # - { target: arm-unknown-linux-gnueabihf , os: ubuntu-24.04, use-cross: true }
          - { target: arm-unknown-linux-musleabihf, os: ubuntu-24.04, use-cross: true }
          # - { target: x86_64-apple-darwin         , os: macos-26-intel                }
          # - { target: aarch64-apple-darwin        , os: macos-26                      }
          # - { target: x86_64-pc-windows-gnu       , os: windows-2025                  }
          # - { target: x86_64-pc-windows-msvc      , os: windows-2025                  }
          # - { target: aarch64-pc-windows-msvc     , os: windows-11-arm                }
          # - { target: x86_64-unknown-linux-gnu    , os: ubuntu-24.04, use-cross: true }
          - { target: x86_64-unknown-linux-musl   , os: ubuntu-24.04, use-cross: true }
    env:
      BUILD_CMD: "${{ matrix.job.use-cross && 'cross' || 'cargo' }}"
      target: ${{ matrix.job.target }}
      name: ${{ needs.crate_metadata.outputs.name }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
    
      - uses: dtolnay/rust-toolchain@master
        with:
          targets: ${{ matrix.job.target }}
          toolchain: 1.95

      - name: Download `binstall`.
        if: matrix.job.use-cross
        uses: cargo-bins/cargo-binstall@v1.18.1

      - name: Install `cross` and compile artifact
        run: |
          cargo binstall \
            --version=0.2.5 \
            --no-confirm \
            cross

      - name: Show version information (Rust, cargo, GCC)
        shell: bash
        run: |
          gcc --version || true
          rustup -V
          rustup toolchain list
          rustup default
          cargo -V
          rustc -V

      - name: Build
        shell: bash
        run: $BUILD_CMD build --locked --release --target="${target}"

      - name: Set binary name & path
        id: bin
        shell: bash
        run: |
          # Figure out suffix of binary
          EXE_suffix=""
          case ${target} in
            *-pc-windows-*) EXE_suffix=".exe" ;;
          esac;

          # Setup paths
          BIN_NAME="retrodate-${target}${EXE_suffix}"
          BIN_PATH="target/${target}/release/retrodate${EXE_suffix}"

          mv -v "target/${target}/release/retrodate${EXE_suffix}" "${BIN_PATH}"

          # Let subsequent steps know where to find the binary
          echo "BIN_PATH=${BIN_PATH}" >> $GITHUB_OUTPUT
          echo "BIN_NAME=${BIN_NAME}" >> $GITHUB_OUTPUT

      - name: "Artifact upload"
        id: upload
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: ${{ steps.bin.outputs.BIN_NAME }}-${{ matrix.job.target }}
          path: ${{ steps.bin.outputs.BIN_PATH }}

      - name: Publish archives and packages
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        # if: steps.is-release.outputs.IS_RELEASE
        with:
          files: |
            ${{ steps.package.outputs.PKG_PATH }}
            ${{ steps.debian-package.outputs.DPKG_PATH }}
